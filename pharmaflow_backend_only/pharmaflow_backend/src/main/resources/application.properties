spring.application.name=PharmaFlow

#DB config
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/PharmaFlow?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:tad@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
#default server port 8080
#server.port=9090

#Spring security custom properties
#JWT secret key
jwt.secret.key=${JWT_SECRET:pharmaflowSecureSecretKeyForJwtSigningChangeThisInProduction123456}
#JWT expiration time in msec (2 hours = 7200000)
jwt.expiration.time=${JWT_EXPIRATION:7200000}

#Admin bootstrap (first-admin seeding) - see README for details
pharmaflow.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
pharmaflow.admin.bootstrap.email=${PHARMAFLOW_ADMIN_EMAIL:admin@pharmaflow.local}
pharmaflow.admin.bootstrap.password=${PHARMAFLOW_ADMIN_PASSWORD:ChangeMe123!}
pharmaflow.admin.bootstrap.first-name=${PHARMAFLOW_ADMIN_FIRST_NAME:System}
pharmaflow.admin.bootstrap.last-name=${PHARMAFLOW_ADMIN_LAST_NAME:Admin}

#Folder where uploaded prescription images are stored (relative to project root)
file.upload-dir=uploads/prescriptions

#Multipart upload limits - prescription images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#Razorpay Payment Gateway Test Credentials
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TMAWYFG6JUtyio}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:WfSXBxDzrlb2tMt3oEmRzBQu}

